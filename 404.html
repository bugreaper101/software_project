    <meta property="og:description" content="An evening of French elegance. Fine dining, seasonal tasting menus, and an intimate candlelit room." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap"

    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #0a0a0b; color: #f3efe6; }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // GitHub Pages serves this source HTML (not the Vite build). Browsers cannot
      // execute TSX, so load the committed production bundle if React never mounts.
      (function () {
        var booted = false;
        function bootFromBuild() {
          if (booted) return;
          if (document.querySelector('script[src*="/assets/"]')) return;
          booted = true;
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './assets/index.css';
          document.head.appendChild(css);
          var s = document.createElement('script');
          s.type = 'module';
          s.src = './assets/index.js';
          document.body.appendChild(s);
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT') bootFromBuild();
        }, true);
        window.addEventListener('unhandledrejection', function () {
          var root = document.getElementById('root');
          if (root && !root.childElementCount) bootFromBuild();
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.childElementCount) bootFromBuild();
        }, 300);
      })();
    </script>
  </body>
</html>
