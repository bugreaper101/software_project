<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .lumiere-bg { fill: #1a1a1a; }
      .lumiere-text { font-family: 'Cormorant Garamond', serif; font-size: 45px; font-weight: 700; fill: #d4af37; }
      .lumiere-flame { fill: #d4af37; opacity: 0.9; }
    </style>
  </defs>
  <!-- Background -->
  <rect class="lumiere-bg" width="100" height="100" rx="10"/>
  
  <!-- Candle flame (stylized L) -->
  <text x="50" y="72" text-anchor="middle" class="lumiere-text">L</text>
  
  <!-- Gold accent dots representing candlelight -->
  <circle cx="30" cy="25" r="3" class="lumiere-flame" opacity="0.8"/>
  <circle cx="70" cy="20" r="2" class="lumiere-flame" opacity="0.6"/>
  <circle cx="85" cy="40" r="2.5" class="lumiere-flame" opacity="0.7"/>
</svg>
